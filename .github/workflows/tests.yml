name: Tests

# Runs the Core test suite on every pull request and every push to master, and checks the packages for known vulnerabilities.
# The suite runs on net10.0 and net11.0 in Release, and on net11.0 in Debug (Debug.Assert is live there).
# A separate job runs the LegacyCompiler tests, which compile the public call shapes with older C# language versions.
# Another job builds the Benchmarks project (it is not in the solution), so a change to the public API cannot leave its call sites behind.
# Another runs `dotnet format` style and analyzers at info severity on every project, which is what the IDE shows.
# SQL Server LocalDB is part of the runner image. ODX_REQUIRE_SQL=1 makes the tests that need it fail, instead of skip, when it is missing.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a pull request's ref (refs/pull/N/merge) never equals master's, so a pull request run can never cancel a master run.
# A newer push to a pull request cancels the older run; master and manual runs queue and are never cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: net10.0-Release
            tfm: net10.0
            configuration: Release
          - name: net11.0-Release
            tfm: net11.0
            configuration: Release
          - name: net11.0-Debug
            tfm: net11.0
            configuration: Debug
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The tests that need a real SQL Server connect to (localdb)\MSSQLLocalDB. The runner image carries the LocalDB runtime,
      # but the automatic instance is created on its first start, which can outlast a connection timeout. Start it here,
      # so the first test does not pay for it, and fail now, with a clear message, if the image has no LocalDB.
      - name: Start SQL Server LocalDB
        run: |
          $exe = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $exe) {
            $exe = Get-ChildItem "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw 'SqlLocalDB.exe was not found on this runner image, so the SQL Server tests cannot run.' }
          & $exe start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw "SqlLocalDB start MSSQLLocalDB failed with exit code $LASTEXITCODE" }
          & $exe info MSSQLLocalDB

      - name: Run the tests (${{ matrix.name }})
        env:
          ODX_REQUIRE_SQL: 1
        run: dotnet test Tests/Open.Database.Extensions.Core.Tests -c ${{ matrix.configuration }} -f ${{ matrix.tfm }} --logger "trx;LogFileName=${{ matrix.name }}.trx" --results-directory TestResults/${{ matrix.name }}

      - name: Upload the TRX files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.name }}
          path: TestResults/${{ matrix.name }}/*.trx

  legacy-compiler:
    name: Test older C# language versions
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The SDK in global.json builds everything; 8.0.x adds the .NET 8 runtime that the net8.0 target of this project runs on.
      # net472 runs on the Windows runner itself.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      # This project compiles the public call shapes with the older C# language versions that consumers still use, one per target framework
      # (see its .csproj), so a binding regression on an older compiler fails here. No -f: it runs every target framework the project has.
      - name: Run the LegacyCompiler tests
        run: dotnet test Tests/Open.Database.Extensions.LegacyCompiler.Tests -c Release --logger "trx;LogFilePrefix=legacy-compiler" --results-directory TestResults/legacy-compiler

      - name: Upload the TRX files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-legacy-compiler
          path: TestResults/legacy-compiler/*.trx

  generator:
    name: Test the source generator prototype
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The generator runs as an analyzer of the test project and intercepts its Map<T>() calls on the models of another assembly;
      # each test compares those rows, or that exception, with the runtime map's on the same data. No -f: net10.0 and net11.0.
      - name: Run the generator tests
        run: dotnet test Tests/Open.Database.Extensions.Generator.Tests -c Release --logger "trx;LogFilePrefix=generator" --results-directory TestResults/generator

      - name: Upload the TRX files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-generator
          path: TestResults/generator/*.trx

  benchmarks-build:
    name: Build the Benchmarks project
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The Benchmarks project is not in the solution, so no other job compiles it. Only the build runs here: no benchmark is run.
      # No -f: both target frameworks of the project build.
      - name: Build the Benchmarks project (Release)
        run: dotnet build Benchmarks/Open.Database.Extensions.Benchmarks -c Release

  format:
    name: Style and analyzers (info)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # dotnet format checks every target framework of each project, at info severity, and changes nothing.
      # It exits non-zero when it finds something. When it cannot load a project or a framework it can print nothing and exit 0,
      # so that output is a failure too: a zero that proves nothing must not pass.
      - name: dotnet format style and analyzers (any finding fails the run)
        run: |
          $projects = @(
            'Source\Core', 'Source\SqlClient', 'Source\MSSqlClient', 'Source\Channel', 'Source\Dataflow', 'Source\Extensions',
            'Tests\Open.Database.Extensions.Core.Tests', 'Tests\Open.Database.Extensions.LegacyCompiler.Tests', 'docsite\samples', 'Benchmarks\Open.Database.Extensions.Benchmarks',
            'Source\Generator', 'Tests\Open.Database.Extensions.Generator.Models', 'Tests\Open.Database.Extensions.Generator.Tests', 'Benchmarks\Open.Database.Extensions.Benchmarks.Generated')
          $failures = @()
          foreach ($project in $projects) {
            # A full Windows path: with forward slashes the formatter loads nothing and reports a false zero.
            $path = (Resolve-Path $project).Path
            dotnet restore $path --nologo --verbosity quiet
            if ($LASTEXITCODE -ne 0) { $failures += "${project}: restore failed"; continue }
            foreach ($check in 'style', 'analyzers') {
              $output = (dotnet format $check $path --severity info --verify-no-changes --no-restore --verbosity minimal 2>&1 | Out-String -Width 4096)
              $exitCode = $LASTEXITCODE
              Write-Host "== $project $check (exit code $exitCode)"
              Write-Host $output
              if ($output -match 'did not load|Msbuild failed|not recognized') {
                $failures += "$project ${check}: the formatter could not load a project or framework, so the check proved nothing"
              }
              elseif ($exitCode -ne 0) {
                $failures += "$project ${check}: findings at info severity (listed above)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Host "::error title=dotnet format::$failure" }
            exit 1
          }
          "No style or analyzer findings in $($projects.Count) project(s)."

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so read what it prints.
      # Each library project, the test project and the benchmark projects are listed with their transitive packages.
      - name: List vulnerable packages (any finding fails the run)
        run: |
          $projects = @(Get-ChildItem Source -Recurse -Filter *.csproj) + @(Get-Item Tests/Open.Database.Extensions.Core.Tests/*.csproj) + @(Get-ChildItem Benchmarks -Recurse -Filter *.csproj)
          $failures = @()
          foreach ($project in $projects) {
            $output = (dotnet list $project.FullName package --vulnerable --include-transitive 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
            Write-Host $output
            if ($exitCode -ne 0) {
              $failures += "$($project.Name): dotnet list exited with code $exitCode"
            }
            elseif ($output -match 'has the following vulnerable packages') {
              $failures += "$($project.Name): vulnerable packages found (listed above)"
            }
            elseif ($output -match 'NU1900') {
              $failures += "$($project.Name): the vulnerability data could not be read, so the check proved nothing"
            }
          }
          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Host "::error title=Vulnerable packages::$failure" }
            exit 1
          }
          "No vulnerable packages in $($projects.Count) project(s)."
