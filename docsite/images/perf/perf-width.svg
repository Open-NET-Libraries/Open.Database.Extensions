  <circle class="m-select" cx="54" cy="293.49" r="4.5"><title>Row class + Select, 1 columns: 28.3 µs per call</title></circle>
  <circle class="m-select" cx="91.47" cy="289.37" r="4.5"><title>Row class + Select, 3 columns: 32.4 µs per call</title></circle>
