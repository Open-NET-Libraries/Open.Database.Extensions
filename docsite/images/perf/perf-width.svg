<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="width-title width-desc">
  <title id="width-title">Cost grows with the number of columns</title>
  <desc id="width-desc">A line chart of total time per call, in microseconds, against 1 to 20 columns, 1,000 rows, five approaches with labels at the line ends; the axis starts at zero. Hand-written selector: 1 columns 11.8 µs, 3 columns 13.2 µs, 5 columns 16.9 µs, 10 columns 32.0 µs, 20 columns 49.4 µs. Map&lt;T&gt;(): 1 columns 13.1 µs, 3 columns 18.7 µs, 5 columns 25.8 µs, 10 columns 50.6 µs, 20 columns 83.2 µs. Factory map: 1 columns 23.7 µs, 3 columns 29.1 µs, 5 columns 37.0 µs, 10 columns 60.5 µs, 20 columns 101.9 µs. object[] rows: 1 columns 10.5 µs, 3 columns 22.4 µs, 5 columns 35.0 µs, 10 columns 91.2 µs, 20 columns 177.9 µs. Dapper: 1 columns 19.4 µs, 3 columns 31.0 µs, 5 columns 43.9 µs, 10 columns 99.7 µs, 20 columns 199.9 µs.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="559" height="379" rx="8"/>
  <text class="title" x="16" y="28">Cost grows with the number of columns</text>
  <text class="muted" x="16" y="48">Total time per call at 1,000 rows. Lower is better; the slope is the cost per cell.</text>
