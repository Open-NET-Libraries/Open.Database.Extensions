<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="width-title width-desc">
  <title id="width-title">Cost grows with the number of columns</title>
  <desc id="width-desc">A line chart of total time per call, in microseconds, against 1 to 20 columns, 1,000 rows, five approaches with labels at the line ends; the axis starts at zero. Hand-written selector: 1 columns 10.7 µs, 3 columns 11.9 µs, 5 columns 16.8 µs, 10 columns 31.2 µs, 20 columns 47.0 µs. RowMap plan: 1 columns 12.4 µs, 3 columns 18.3 µs, 5 columns 25.2 µs, 10 columns 49.1 µs, 20 columns 81.7 µs. Row class + Select: 1 columns 28.3 µs, 3 columns 32.4 µs, 5 columns 41.4 µs, 10 columns 67.2 µs, 20 columns 106.7 µs. object[] rows: 1 columns 9.5 µs, 3 columns 20.0 µs, 5 columns 35.9 µs, 10 columns 75.7 µs, 20 columns 178.5 µs. Dapper: 1 columns 18.5 µs, 3 columns 31.1 µs, 5 columns 44.6 µs, 10 columns 96.2 µs, 20 columns 202.7 µs.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-fill: #ddf4ff;
      --one-line: #0969da;
      --select-fill: #dafbe1;
      --select-line: #1a7f37;
      --dapper-fill: #ffe8d1;
      --dapper-line: #bc4c00;
      --grey-fill: #eaeef2;
      --grey-line: #6e7781;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-fill: #0c2d6b;
        --one-line: #58a6ff;
        --select-fill: #0f3d1f;
        --select-line: #3fb950;
        --dapper-fill: #4a2a0e;
        --dapper-line: #f0883e;
        --grey-fill: #2d333b;
        --grey-line: #8b949e;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-fill); stroke: var(--one-line); stroke-width: 1.5; }
    .select { fill: var(--select-fill); stroke: var(--select-line); stroke-width: 1.5; }
    .dapper { fill: var(--dapper-fill); stroke: var(--dapper-line); stroke-width: 1.5; }
    .grey { fill: var(--grey-fill); stroke: var(--grey-line); stroke-width: 1.5; }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="559" height="379" rx="8"/>
  <text class="title" x="16" y="28">Cost grows with the number of columns</text>
  <text class="muted" x="16" y="48">Total time per call at 1,000 rows. Lower is better; the slope is the cost per cell.</text>
