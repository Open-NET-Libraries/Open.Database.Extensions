<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" role="img" aria-labelledby="summary-title summary-desc">
  <title id="summary-title">Map&lt;T&gt;() against Dapper and hand-written code</title>
  <desc id="summary-desc">Two panels of four bars each, each panel on its own scale: how long the connection is held open, and how much memory is allocated, for four ways of reading 20 columns and 1,000 rows from a synthetic in-memory reader. Every bar starts at zero. Connection held open (shorter is better): Hand-written selector 44.8 µs; Dapper.AOT 63.4 µs; Map&lt;T&gt;() 84.9 µs; Dapper Query&lt;T&gt; 246.0 µs. Memory allocated (smaller is better): Dapper.AOT 227.4 KB; Map&lt;T&gt;() 227.4 KB; Hand-written selector 227.4 KB; Dapper Query&lt;T&gt; 548.1 KB.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="519" height="407" rx="8"/>
  <text class="title" x="16" y="28">Map&lt;T&gt;() against Dapper and hand-written code</text>
  <text class="muted" x="16" y="48">One call reads 20 columns and 1,000 rows from a synthetic reader.</text>
  <rect class="one" x="16" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="72">ODX: one object per row</text>
  <rect class="dapper" x="200" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="218" y="72">Dapper 2.1.89</text>
  <rect class="select" x="318" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="336" y="72">Dapper.AOT 1.1.0</text>
  <text class="head" x="16" y="108">Connection held open (shorter is better)</text>
  <g>
    <title>Hand-written selector: connection held 44.8 µs, 227.4 KB allocated per call.</title>
    <rect class="hit" x="0" y="118" width="520" height="26"/>
    <text class="name" x="140" y="135">Hand-written selector</text>
    <path class="one" d="M150,123 h50.26 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-50.26 z"/>
    <text class="val" x="210.26" y="135">44.8 µs</text>
  </g>
  <g>
    <title>Dapper.AOT: connection held 63.4 µs, 227.4 KB allocated per call.</title>
    <rect class="hit" x="0" y="144" width="520" height="26"/>
    <text class="name" x="140" y="161">Dapper.AOT</text>
    <path class="select" d="M150,149 h72.82 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-72.82 z"/>
    <text class="val" x="232.82" y="161">63.4 µs</text>
  </g>
  <g>
    <title>Map&lt;T&gt;(): connection held 84.9 µs, 227.4 KB allocated per call.</title>
    <rect class="hit" x="0" y="170" width="520" height="26"/>
    <text class="name" x="140" y="187">Map&lt;T&gt;()</text>
    <path class="one" d="M150,175 h98.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-98.9 z"/>
    <text class="val" x="258.9" y="187">84.9 µs</text>
  </g>
  <g>
    <title>Dapper Query&lt;T&gt;: connection held 246.0 µs, 548.1 KB allocated per call.</title>
    <rect class="hit" x="0" y="196" width="520" height="26"/>
    <text class="name" x="140" y="213">Dapper Query&lt;T&gt;</text>
    <path class="dapper" d="M150,201 h294 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-294 z"/>
    <text class="val" x="454" y="213">246.0 µs</text>
  </g>
  <line class="axis" x1="150" y1="118" x2="150" y2="222"/>
  <text class="head" x="16" y="250">Memory allocated (smaller is better)</text>
  <g>
    <title>Dapper.AOT: connection held 63.4 µs, 227.4 KB allocated per call.</title>
    <rect class="hit" x="0" y="260" width="520" height="26"/>
    <text class="name" x="140" y="277">Dapper.AOT</text>
    <path class="select" d="M150,265 h119.64 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-119.64 z"/>
    <text class="val" x="279.64" y="277">227.4 KB</text>
  </g>
  <g>
    <title>Map&lt;T&gt;(): connection held 84.9 µs, 227.4 KB allocated per call.</title>
    <rect class="hit" x="0" y="286" width="520" height="26"/>
    <text class="name" x="140" y="303">Map&lt;T&gt;()</text>
    <path class="one" d="M150,291 h119.65 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-119.65 z"/>
    <text class="val" x="279.65" y="303">227.4 KB</text>
  </g>
  <g>
    <title>Hand-written selector: connection held 44.8 µs, 227.4 KB allocated per call.</title>
    <rect class="hit" x="0" y="312" width="520" height="26"/>
    <text class="name" x="140" y="329">Hand-written selector</text>
    <path class="one" d="M150,317 h119.66 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-119.66 z"/>
    <text class="val" x="279.66" y="329">227.4 KB</text>
  </g>
  <g>
    <title>Dapper Query&lt;T&gt;: connection held 246.0 µs, 548.1 KB allocated per call.</title>
    <rect class="hit" x="0" y="338" width="520" height="26"/>
    <text class="name" x="140" y="355">Dapper Query&lt;T&gt;</text>
    <path class="dapper" d="M150,343 h294 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-294 z"/>
    <text class="val" x="454" y="355">548.1 KB</text>
  </g>
  <line class="axis" x1="150" y1="260" x2="150" y2="364"/>
  <text class="muted small" x="16" y="386">Build b5b0014, 2026-11-21, one run per case. Numbers: library-synthetic.csv</text>
</svg>
