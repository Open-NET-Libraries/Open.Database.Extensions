<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" role="img" aria-labelledby="syn-total-title syn-total-desc">
  <title id="syn-total-title">Total time per call</title>
  <desc id="syn-total-desc">Ranked horizontal bars, shortest first, one per way of reading 20 columns and 1,000 rows from a synthetic in-memory reader, colored by family. Every bar starts at zero. Map(selector), hand-written 47.0 µs; Selector, reused row, Select 59.0 µs; Selector, pooled row, Select 63.1 µs; Shaping inside the selector 67.8 µs; Map&lt;T&gt;() 81.7 µs; Row class, close, then Select 97.8 µs; Row class, inline Select 106.7 µs; Row class, shaping after close 134.5 µs; Row class, shaping in Select 139.2 µs; object[] rows (baseline) 178.5 µs; Dapper Query&lt;T&gt; 202.7 µs; Dapper, inline Select 214.3 µs; Dapper, then Select after 217.1 µs; object[] rows, objects later 221.0 µs; Dapper, shaping after 256.2 µs; Dapper, shaping in Select 257.9 µs.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="559" height="611" rx="8"/>
  <text class="title" x="16" y="28">Total time per call</text>
  <text class="muted" x="16" y="48">Shorter is better. Where it is far above reader-open time, work happens after the reader closes.</text>
  <rect class="one" x="16" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="72">ODX: one object per row</text>
  <rect class="select" x="200" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="218" y="72">ODX: row class, then Select</text>
  <rect class="grey" x="16" y="82" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="92">ODX: raw object[] rows</text>
  <rect class="dapper" x="194" y="82" width="12" height="12" rx="3"/>
  <text class="small" x="212" y="92">Dapper 2.1.89</text>
  <line class="grid" x1="232" y1="114" x2="232" y2="530"/>
  <text class="muted small mid" x="232" y="546">0</text>
  <line class="grid" x1="317.33" y1="114" x2="317.33" y2="530"/>
  <text class="muted small mid" x="317.33" y="546">100</text>
  <line class="grid" x1="402.67" y1="114" x2="402.67" y2="530"/>
  <text class="muted small mid" x="402.67" y="546">200</text>
  <line class="grid" x1="488" y1="114" x2="488" y2="530"/>
  <text class="muted small mid" x="488" y="546">300</text>
  <g>
    <title>Map(selector), hand-written (V2): A static Func&lt;IDataRecord,T&gt; with typed getters. Reader open 46.8 µs, total 47.0 µs, 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="114" width="560" height="26"/>
    <text class="name" x="222" y="131">Map(selector), hand-written</text>
    <path class="one" d="M232,119 h36.07 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-36.07 z"/>
    <text class="val" x="278.07" y="131">47.0 µs</text>
  </g>
  <g>
    <title>Selector, reused row, Select (V4a): Caller recipe: fill one held row, project it. Reader open 58.8 µs, total 59.0 µs, 228.1 KB allocated.</title>
    <rect class="hit" x="0" y="140" width="560" height="26"/>
    <text class="name" x="222" y="157">Selector, reused row, Select</text>
    <path class="one" d="M232,145 h46.36 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-46.36 z"/>
    <text class="val" x="288.36" y="157">59.0 µs</text>
  </g>
  <g>
    <title>Selector, pooled row, Select (V4b): Caller recipe: rent a row, project it, return it. Reader open 62.8 µs, total 63.1 µs, 228.2 KB allocated.</title>
    <rect class="hit" x="0" y="166" width="560" height="26"/>
    <text class="name" x="222" y="183">Selector, pooled row, Select</text>
    <path class="one" d="M232,171 h49.81 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-49.81 z"/>
    <text class="val" x="291.81" y="183">63.1 µs</text>
  </g>
  <g>
    <title>Shaping inside the selector (V6a): Computed members built in the selector. Reader open 67.6 µs, total 67.8 µs, 297.7 KB allocated.</title>
    <rect class="hit" x="0" y="192" width="560" height="26"/>
    <text class="name" x="222" y="209">Shaping inside the selector</text>
    <path class="one" d="M232,197 h53.83 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-53.83 z"/>
    <text class="val" x="295.83" y="209">67.8 µs</text>
  </g>
  <g>
    <title>Map&lt;T&gt;() (V1): The cached, compiled typed plan. Reader open 81.6 µs, total 81.7 µs, 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="218" width="560" height="26"/>
    <text class="name" x="222" y="235">Map&lt;T&gt;()</text>
    <path class="one" d="M232,223 h65.74 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-65.74 z"/>
    <text class="val" x="307.74" y="235">81.7 µs</text>
  </g>
  <g>
    <title>Row class, close, then Select (V5): Map&lt;Row&gt;().ToList(), then Select after the reader closes. Reader open 82.1 µs, total 97.8 µs, 446.3 KB allocated.</title>
    <rect class="hit" x="0" y="244" width="560" height="26"/>
    <text class="name" x="222" y="261">Row class, close, then Select</text>
    <path class="select" d="M232,249 h79.46 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-79.46 z"/>
    <text class="val" x="321.46" y="261">97.8 µs</text>
  </g>
  <g>
    <title>Row class, inline Select (V3): Two objects per row: a row class, then Select while the reader is open. Reader open 106.4 µs, total 106.7 µs, 438.7 KB allocated.</title>
    <rect class="hit" x="0" y="270" width="560" height="26"/>
    <text class="name" x="222" y="287">Row class, inline Select</text>
    <path class="select" d="M232,275 h87.02 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-87.02 z"/>
    <text class="val" x="329.02" y="287">106.7 µs</text>
  </g>
  <g>
    <title>Row class, shaping after close (V6d): Computed members built after the reader closes. Reader open 82.3 µs, total 134.5 µs, 516.7 KB allocated.</title>
    <rect class="hit" x="0" y="296" width="560" height="26"/>
    <text class="name" x="222" y="313">Row class, shaping after close</text>
    <path class="select" d="M232,301 h110.76 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-110.76 z"/>
    <text class="val" x="352.76" y="313">134.5 µs</text>
  </g>
  <g>
    <title>Row class, shaping in Select (V6c): Computed members built in an inline Select, reader open. Reader open 138.9 µs, total 139.2 µs, 509.1 KB allocated.</title>
    <rect class="hit" x="0" y="322" width="560" height="26"/>
    <text class="name" x="222" y="339">Row class, shaping in Select</text>
    <path class="select" d="M232,327 h114.76 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-114.76 z"/>
    <text class="val" x="356.76" y="339">139.2 µs</text>
  </g>
  <g>
    <title>object[] rows (baseline) (V0): Every cell boxed into an object[] with GetValues; the baseline. Reader open 178.4 µs, total 178.5 µs, 516.6 KB allocated.</title>
    <rect class="hit" x="0" y="348" width="560" height="26"/>
    <text class="name" x="222" y="365">object[] rows (baseline)</text>
    <path class="grey" d="M232,353 h148.32 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-148.32 z"/>
    <text class="val" x="390.32" y="365">178.5 µs</text>
  </g>
  <g>
    <title>Dapper Query&lt;T&gt; (V7_V1): Dapper 2.1.89, buffered Query&lt;T&gt;, the plain map. Reader open 202.4 µs, total 202.7 µs, 548.1 KB allocated.</title>
    <rect class="hit" x="0" y="374" width="560" height="26"/>
    <text class="name" x="222" y="391">Dapper Query&lt;T&gt;</text>
    <path class="dapper" d="M232,379 h168.94 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-168.94 z"/>
    <text class="val" x="410.94" y="391">202.7 µs</text>
  </g>
  <g>
    <title>Dapper, inline Select (V7_V3): Query&lt;Row&gt;(buffered: false) with Select. Reader open 214.0 µs, total 214.3 µs, 759.0 KB allocated.</title>
    <rect class="hit" x="0" y="400" width="560" height="26"/>
    <text class="name" x="222" y="417">Dapper, inline Select</text>
    <path class="dapper" d="M232,405 h178.83 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-178.83 z"/>
    <text class="val" x="420.83" y="417">214.3 µs</text>
  </g>
  <g>
    <title>Dapper, then Select after (V7_V5): Query&lt;Row&gt;, then Select after. Reader open 197.5 µs, total 217.1 µs, 767.0 KB allocated.</title>
    <rect class="hit" x="0" y="426" width="560" height="26"/>
    <text class="name" x="222" y="443">Dapper, then Select after</text>
    <path class="dapper" d="M232,431 h181.28 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-181.28 z"/>
    <text class="val" x="423.28" y="443">217.1 µs</text>
  </g>
  <g>
    <title>object[] rows, objects later (V0b): GetValues into object[], typed objects built afterwards. Reader open 170.1 µs, total 221.0 µs, 735.4 KB allocated.</title>
    <rect class="hit" x="0" y="452" width="560" height="26"/>
    <text class="name" x="222" y="469">object[] rows, objects later</text>
    <path class="grey" d="M232,457 h184.62 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-184.62 z"/>
    <text class="val" x="426.62" y="469">221.0 µs</text>
  </g>
  <g>
    <title>Dapper, shaping after (V7_V6d): Query&lt;Row&gt;, computed members afterwards. Reader open 200.5 µs, total 256.2 µs, 837.4 KB allocated.</title>
    <rect class="hit" x="0" y="478" width="560" height="26"/>
    <text class="name" x="222" y="495">Dapper, shaping after</text>
    <path class="dapper" d="M232,483 h214.63 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-214.63 z"/>
    <text class="val" x="456.63" y="495">256.2 µs</text>
  </g>
  <g>
    <title>Dapper, shaping in Select (V7_V6c): Unbuffered Query&lt;Row&gt;, computed members in Select. Reader open 257.6 µs, total 257.9 µs, 829.3 KB allocated.</title>
    <rect class="hit" x="0" y="504" width="560" height="26"/>
    <text class="name" x="222" y="521">Dapper, shaping in Select</text>
    <path class="dapper" d="M232,509 h216.05 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-216.05 z"/>
    <text class="val" x="458.05" y="521">257.9 µs</text>
  </g>
  <line class="axis" x1="232" y1="114" x2="232" y2="530"/>
  <text class="muted small mid" x="360" y="562">microseconds per call, the whole call</text>
  <text class="muted small" x="16" y="590">Build b27a02f, 2026-11-14, one run per case. Numbers: synthetic-overhead.csv</text>
</svg>
