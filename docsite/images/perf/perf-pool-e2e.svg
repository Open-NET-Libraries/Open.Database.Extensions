<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" role="img" aria-labelledby="pool-e2e-title pool-e2e-desc">
  <title id="pool-e2e-title">The final design against the Memory chunks build</title>
  <desc id="pool-e2e-desc">Eight bars, one per terminal and row count: how much less time the final arrays design takes than the Memory chunks build it replaced. Every bar starts at zero. ToArrayAsync, 10,000 rows 4.8%; ToAsyncBuffer_Items, 10,000 rows 2.9%; ToAsyncBufferStream, 10,000 rows 2.1%; ToListAsync, 10,000 rows 5.2%; ToArrayAsync, 100 rows 3.4%; ToAsyncBuffer_Items, 100 rows 3.2%; ToAsyncBufferStream, 100 rows 3.3%; ToListAsync, 100 rows 3.1%.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="559" height="355" rx="8"/>
  <text class="title" x="16" y="28">The final design against the Memory chunks build</text>
  <text class="muted" x="16" y="48">Longer is better. How much less time the call takes, in percent.</text>
  <line class="grid" x1="250" y1="66" x2="250" y2="274"/>
  <text class="muted small mid" x="250" y="290">0</text>
  <line class="grid" x1="329.33" y1="66" x2="329.33" y2="274"/>
  <text class="muted small mid" x="329.33" y="290">2</text>
  <line class="grid" x1="408.67" y1="66" x2="408.67" y2="274"/>
  <text class="muted small mid" x="408.67" y="290">4</text>
  <line class="grid" x1="488" y1="66" x2="488" y2="274"/>
  <text class="muted small mid" x="488" y="290">6</text>
  <g>
    <title>ToArrayAsync, 10,000 rows: 3.4 ms before, 3.2 ms after, 4.8% less time.</title>
    <rect class="hit" x="0" y="66" width="560" height="26"/>
    <text class="name" x="240" y="83">ToArrayAsync, 10,000 rows</text>
    <path class="one" d="M250,71 h186.47 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-186.47 z"/>
    <text class="val" x="446.47" y="83">4.8%</text>
  </g>
  <g>
    <title>ToAsyncBuffer_Items, 10,000 rows: 3.4 ms before, 3.3 ms after, 2.9% less time.</title>
    <rect class="hit" x="0" y="92" width="560" height="26"/>
    <text class="name" x="240" y="109">ToAsyncBuffer_Items, 10,000 rows</text>
    <path class="one" d="M250,97 h111.77 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-111.77 z"/>
    <text class="val" x="371.77" y="109">2.9%</text>
  </g>
  <g>
    <title>ToAsyncBufferStream, 10,000 rows: 3.4 ms before, 3.4 ms after, 2.1% less time.</title>
    <rect class="hit" x="0" y="118" width="560" height="26"/>
    <text class="name" x="240" y="135">ToAsyncBufferStream, 10,000 rows</text>
    <path class="one" d="M250,123 h80.67 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-80.67 z"/>
    <text class="val" x="340.67" y="135">2.1%</text>
  </g>
  <g>
    <title>ToListAsync, 10,000 rows: 3.4 ms before, 3.2 ms after, 5.2% less time.</title>
    <rect class="hit" x="0" y="144" width="560" height="26"/>
    <text class="name" x="240" y="161">ToListAsync, 10,000 rows</text>
    <path class="one" d="M250,149 h201.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-201.9 z"/>
    <text class="val" x="461.9" y="161">5.2%</text>
  </g>
  <g>
    <title>ToArrayAsync, 100 rows: 39.1 µs before, 37.8 µs after, 3.4% less time.</title>
    <rect class="hit" x="0" y="170" width="560" height="26"/>
    <text class="name" x="240" y="187">ToArrayAsync, 100 rows</text>
    <path class="one" d="M250,175 h131 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-131 z"/>
    <text class="val" x="391" y="187">3.4%</text>
  </g>
  <g>
    <title>ToAsyncBuffer_Items, 100 rows: 68.4 µs before, 66.2 µs after, 3.2% less time.</title>
    <rect class="hit" x="0" y="196" width="560" height="26"/>
    <text class="name" x="240" y="213">ToAsyncBuffer_Items, 100 rows</text>
    <path class="one" d="M250,201 h122.42 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-122.42 z"/>
    <text class="val" x="382.42" y="213">3.2%</text>
  </g>
  <g>
    <title>ToAsyncBufferStream, 100 rows: 79.5 µs before, 76.8 µs after, 3.3% less time.</title>
    <rect class="hit" x="0" y="222" width="560" height="26"/>
    <text class="name" x="240" y="239">ToAsyncBufferStream, 100 rows</text>
    <path class="one" d="M250,227 h126.31 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-126.31 z"/>
    <text class="val" x="386.31" y="239">3.3%</text>
  </g>
  <g>
    <title>ToListAsync, 100 rows: 39.0 µs before, 37.8 µs after, 3.1% less time.</title>
    <rect class="hit" x="0" y="248" width="560" height="26"/>
    <text class="name" x="240" y="265">ToListAsync, 100 rows</text>
    <path class="one" d="M250,253 h118.11 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-118.11 z"/>
    <text class="val" x="378.11" y="265">3.1%</text>
  </g>
  <line class="axis" x1="250" y1="66" x2="250" y2="274"/>
  <text class="muted small mid" x="369" y="306">percent less time than the Memory&lt;T&gt; chunks build (SQLite in memory, class rows)</text>
  <text class="muted small" x="16" y="334">Builds 3c05c47 and d4b47b8, 2026-11-20, one run per case. Numbers: pool-e2e.csv</text>
</svg>
