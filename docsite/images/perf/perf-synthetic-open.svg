<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" role="img" aria-labelledby="syn-open-title syn-open-desc">
  <title id="syn-open-title">Connection held open per call</title>
  <desc id="syn-open-desc">Ranked horizontal bars, shortest first, one per way of reading 20 columns and 1,000 rows from a synthetic in-memory reader, colored by family. Every bar starts at zero. Map(selector), hand-written 49.2 µs; Selector, reused row, Select 59.2 µs; Selector, pooled row, Select 62.2 µs; Shaping inside the selector 74.0 µs; Row class, close, then Select 82.4 µs; Map&lt;T&gt;() 83.1 µs; Row class, shaping after close 86.5 µs; Factory map, domain object 101.7 µs; Factory map, shaping in the map 133.1 µs; object[] rows, objects later 174.9 µs; object[] rows (baseline) 177.7 µs; Dapper, shaping after 199.4 µs; Dapper Query&lt;T&gt; 199.6 µs; Dapper, then Select after 200.3 µs; Dapper, inline Select 213.9 µs; Dapper, shaping in Select 256.6 µs.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="559" height="611" rx="8"/>
  <text class="title" x="16" y="28">Connection held open per call</text>
  <text class="muted" x="16" y="48">Shorter is better: a shorter bar holds the connection for less time.</text>
  <rect class="one" x="16" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="72">ODX: one object per row</text>
  <rect class="select" x="200" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="218" y="72">ODX: shaped to a domain object</text>
  <rect class="grey" x="16" y="82" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="92">ODX: raw object[] rows</text>
  <rect class="dapper" x="194" y="82" width="12" height="12" rx="3"/>
  <text class="small" x="212" y="92">Dapper 2.1.89</text>
  <line class="grid" x1="232" y1="114" x2="232" y2="530"/>
  <text class="muted small mid" x="232" y="546">0</text>
  <line class="grid" x1="317.33" y1="114" x2="317.33" y2="530"/>
  <text class="muted small mid" x="317.33" y="546">100</text>
  <line class="grid" x1="402.67" y1="114" x2="402.67" y2="530"/>
  <text class="muted small mid" x="402.67" y="546">200</text>
  <line class="grid" x1="488" y1="114" x2="488" y2="530"/>
  <text class="muted small mid" x="488" y="546">300</text>
  <g>
    <title>Map(selector), hand-written (V2): A static Func&lt;IDataRecord,T&gt; with typed getters. Reader open 49.2 µs, total 49.4 µs, 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="114" width="560" height="26"/>
    <text class="name" x="222" y="131">Map(selector), hand-written</text>
    <path class="one" d="M232,119 h38.02 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-38.02 z"/>
    <text class="val" x="280.02" y="131">49.2 µs</text>
  </g>
  <g>
    <title>Selector, reused row, Select (V4a): Caller recipe: fill one held row, project it. Reader open 59.2 µs, total 59.4 µs, 227.9 KB allocated.</title>
    <rect class="hit" x="0" y="140" width="560" height="26"/>
    <text class="name" x="222" y="157">Selector, reused row, Select</text>
    <path class="one" d="M232,145 h46.53 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-46.53 z"/>
    <text class="val" x="288.53" y="157">59.2 µs</text>
  </g>
  <g>
    <title>Selector, pooled row, Select (V4b): Caller recipe: rent a row, project it, return it. Reader open 62.2 µs, total 62.4 µs, 228.0 KB allocated.</title>
    <rect class="hit" x="0" y="166" width="560" height="26"/>
    <text class="name" x="222" y="183">Selector, pooled row, Select</text>
    <path class="one" d="M232,171 h49.11 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-49.11 z"/>
    <text class="val" x="291.11" y="183">62.2 µs</text>
  </g>
  <g>
    <title>Shaping inside the selector (V6a): Computed members built in the selector. Reader open 74.0 µs, total 74.2 µs, 297.8 KB allocated.</title>
    <rect class="hit" x="0" y="192" width="560" height="26"/>
    <text class="name" x="222" y="209">Shaping inside the selector</text>
    <path class="one" d="M232,197 h59.15 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-59.15 z"/>
    <text class="val" x="301.15" y="209">74.0 µs</text>
  </g>
  <g>
    <title>Row class, close, then Select (V5): Map&lt;Row&gt;().ToList(), then Select after the reader closes. Reader open 82.4 µs, total 97.1 µs, 446.3 KB allocated.</title>
    <rect class="hit" x="0" y="218" width="560" height="26"/>
    <text class="name" x="222" y="235">Row class, close, then Select</text>
    <path class="select" d="M232,223 h66.28 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-66.28 z"/>
    <text class="val" x="308.28" y="235">82.4 µs</text>
  </g>
  <g>
    <title>Map&lt;T&gt;() (V1): The cached, compiled typed plan. Reader open 83.1 µs, total 83.2 µs, 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="244" width="560" height="26"/>
    <text class="name" x="222" y="261">Map&lt;T&gt;()</text>
    <path class="one" d="M232,249 h66.87 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-66.87 z"/>
    <text class="val" x="308.87" y="261">83.1 µs</text>
  </g>
  <g>
    <title>Row class, shaping after close (V6d): Computed members built after the reader closes. Reader open 86.5 µs, total 137.2 µs, 516.7 KB allocated.</title>
    <rect class="hit" x="0" y="270" width="560" height="26"/>
    <text class="name" x="222" y="287">Row class, shaping after close</text>
    <path class="select" d="M232,275 h69.85 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-69.85 z"/>
    <text class="val" x="311.85" y="287">86.5 µs</text>
  </g>
  <g>
    <title>Factory map, domain object (V3): One object per row: a factory map straight to the domain object, built while the reader is open. Reader open 101.7 µs, total 101.9 µs, 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="296" width="560" height="26"/>
    <text class="name" x="222" y="313">Factory map, domain object</text>
    <path class="select" d="M232,301 h82.82 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-82.82 z"/>
    <text class="val" x="324.82" y="313">101.7 µs</text>
  </g>
  <g>
    <title>Factory map, shaping in the map (V6c): Computed members built inside the factory map, reader open. Reader open 133.1 µs, total 133.3 µs, 297.7 KB allocated.</title>
    <rect class="hit" x="0" y="322" width="560" height="26"/>
    <text class="name" x="222" y="339">Factory map, shaping in the map</text>
    <path class="select" d="M232,327 h109.58 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-109.58 z"/>
    <text class="val" x="351.58" y="339">133.1 µs</text>
  </g>
  <g>
    <title>object[] rows, objects later (V0b): GetValues into object[], typed objects built afterwards. Reader open 174.9 µs, total 223.4 µs, 735.4 KB allocated.</title>
    <rect class="hit" x="0" y="348" width="560" height="26"/>
    <text class="name" x="222" y="365">object[] rows, objects later</text>
    <path class="grey" d="M232,353 h145.27 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-145.27 z"/>
    <text class="val" x="387.27" y="365">174.9 µs</text>
  </g>
  <g>
    <title>object[] rows (baseline) (V0): Every cell boxed into an object[] with GetValues; the baseline. Reader open 177.7 µs, total 177.9 µs, 516.6 KB allocated.</title>
    <rect class="hit" x="0" y="374" width="560" height="26"/>
    <text class="name" x="222" y="391">object[] rows (baseline)</text>
    <path class="grey" d="M232,379 h147.62 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-147.62 z"/>
    <text class="val" x="389.62" y="391">177.7 µs</text>
  </g>
  <g>
    <title>Dapper, shaping after (V7_V6d): Query&lt;Row&gt;, computed members afterwards. Reader open 199.4 µs, total 252.1 µs, 837.4 KB allocated.</title>
    <rect class="hit" x="0" y="400" width="560" height="26"/>
    <text class="name" x="222" y="417">Dapper, shaping after</text>
    <path class="dapper" d="M232,405 h166.19 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-166.19 z"/>
    <text class="val" x="408.19" y="417">199.4 µs</text>
  </g>
  <g>
    <title>Dapper Query&lt;T&gt; (V7_V1): Dapper 2.1.89, buffered Query&lt;T&gt;, the plain map. Reader open 199.6 µs, total 199.9 µs, 548.1 KB allocated.</title>
    <rect class="hit" x="0" y="426" width="560" height="26"/>
    <text class="name" x="222" y="443">Dapper Query&lt;T&gt;</text>
    <path class="dapper" d="M232,431 h166.31 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-166.31 z"/>
    <text class="val" x="408.31" y="443">199.6 µs</text>
  </g>
  <g>
    <title>Dapper, then Select after (V7_V5): Query&lt;Row&gt;, then Select after. Reader open 200.3 µs, total 216.7 µs, 767.0 KB allocated.</title>
    <rect class="hit" x="0" y="452" width="560" height="26"/>
    <text class="name" x="222" y="469">Dapper, then Select after</text>
    <path class="dapper" d="M232,457 h166.96 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-166.96 z"/>
    <text class="val" x="408.96" y="469">200.3 µs</text>
  </g>
  <g>
    <title>Dapper, inline Select (V7_V3): Query&lt;Row&gt;(buffered: false) with Select. Reader open 213.9 µs, total 214.2 µs, 759.0 KB allocated.</title>
    <rect class="hit" x="0" y="478" width="560" height="26"/>
    <text class="name" x="222" y="495">Dapper, inline Select</text>
    <path class="dapper" d="M232,483 h178.53 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-178.53 z"/>
    <text class="val" x="420.53" y="495">213.9 µs</text>
  </g>
  <g>
    <title>Dapper, shaping in Select (V7_V6c): Unbuffered Query&lt;Row&gt;, computed members in Select. Reader open 256.6 µs, total 256.9 µs, 829.4 KB allocated.</title>
    <rect class="hit" x="0" y="504" width="560" height="26"/>
    <text class="name" x="222" y="521">Dapper, shaping in Select</text>
    <path class="dapper" d="M232,509 h214.96 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-214.96 z"/>
    <text class="val" x="456.96" y="521">256.6 µs</text>
  </g>
  <line class="axis" x1="232" y1="114" x2="232" y2="530"/>
  <text class="muted small mid" x="360" y="562">microseconds from ExecuteReader until the reader closes</text>
  <text class="muted small" x="16" y="590">Build 6a770e8, 2026-11-23, one run per case. Numbers: synthetic-overhead.csv</text>
</svg>
