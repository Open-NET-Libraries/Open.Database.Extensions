<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 472" role="img" aria-labelledby="pool-bin-title pool-bin-desc">
  <title id="pool-bin-title">Releasing a chunk of class rows: clear it here, or hand it to the bin</title>
  <desc id="pool-bin-desc">Three panels of three bars each, each panel on its own scale: the time on the releasing thread to release one chunk of 4,096, 16,384 and 65,536 class rows, with no clear, with an inline clear and by handing it to the recycle bin. Handing to the bin costs 95, 75 and 144 nanoseconds; clearing inline costs 550, 1,786 and 6,738. Every bar starts at zero. 4,096 class rows: No clear 36 ns; Inline clear 550 ns; Hand to the bin 95 ns. 16,384 class rows: No clear 27 ns; Inline clear 1,786 ns; Hand to the bin 75 ns. 65,536 class rows: No clear 44 ns; Inline clear 6,738 ns; Hand to the bin 144 ns.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="519" height="471" rx="8"/>
  <text class="title" x="16" y="28">Releasing a chunk of class rows: clear it here, or hand it to the bin</text>
  <text class="muted" x="16" y="48">Shorter is better. Time on the releasing thread, median of 3 runs, bin never full.</text>
  <rect class="grey" x="16" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="72">No clear</text>
  <rect class="one" x="101" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="119" y="72">Inline clear</text>
  <rect class="select" x="213" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="231" y="72">Post to the recycle bin</text>
  <text class="head" x="16" y="108">4,096 class rows</text>
  <g>
    <title>4,096 class rows, No clear: median 36 ns on the releasing thread (runs: 36, 36, 36).</title>
    <rect class="hit" x="0" y="118" width="520" height="26"/>
    <text class="name" x="120" y="135">No clear</text>
    <path class="grey" d="M130,123 h16.81 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-16.81 z"/>
    <text class="val" x="156.81" y="135">36 ns</text>
  </g>
  <g>
    <title>4,096 class rows, Inline clear: median 550 ns on the releasing thread (runs: 547, 551, 550).</title>
    <rect class="hit" x="0" y="144" width="520" height="26"/>
    <text class="name" x="120" y="161">Inline clear</text>
    <path class="one" d="M130,149 h314 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-314 z"/>
    <text class="val" x="454" y="161">550 ns</text>
  </g>
  <g>
    <title>4,096 class rows, Hand to the bin: median 95 ns on the releasing thread (runs: 102, 72, 95).</title>
    <rect class="hit" x="0" y="170" width="520" height="26"/>
    <text class="name" x="120" y="187">Hand to the bin</text>
    <path class="select" d="M130,175 h50.93 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-50.93 z"/>
    <text class="val" x="190.93" y="187">95 ns</text>
  </g>
  <line class="axis" x1="130" y1="118" x2="130" y2="196"/>
  <text class="head" x="16" y="224">16,384 class rows</text>
  <g>
    <title>16,384 class rows, No clear: median 27 ns on the releasing thread (runs: 34, 27, 27).</title>
    <rect class="hit" x="0" y="234" width="520" height="26"/>
    <text class="name" x="120" y="251">No clear</text>
    <path class="grey" d="M130,239 h2.4 a2.4,2.4 0 0 1 2.4,2.4 v11.19 a2.4,2.4 0 0 1 -2.4,2.4 h-2.4 z"/>
    <text class="val" x="140.81" y="251">27 ns</text>
  </g>
  <g>
    <title>16,384 class rows, Inline clear: median 1,786 ns on the releasing thread (runs: 1,771, 1,786, 1,813).</title>
    <rect class="hit" x="0" y="260" width="520" height="26"/>
    <text class="name" x="120" y="277">Inline clear</text>
    <path class="one" d="M130,265 h314 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-314 z"/>
    <text class="val" x="454" y="277">1,786 ns</text>
  </g>
  <g>
    <title>16,384 class rows, Hand to the bin: median 75 ns on the releasing thread (runs: 75, 70, 76).</title>
    <rect class="hit" x="0" y="286" width="520" height="26"/>
    <text class="name" x="120" y="303">Hand to the bin</text>
    <path class="select" d="M130,291 h9.35 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-9.35 z"/>
    <text class="val" x="149.35" y="303">75 ns</text>
  </g>
  <line class="axis" x1="130" y1="234" x2="130" y2="312"/>
  <text class="head" x="16" y="340">65,536 class rows</text>
  <g>
    <title>65,536 class rows, No clear: median 44 ns on the releasing thread (runs: 44, 44, 38).</title>
    <rect class="hit" x="0" y="350" width="520" height="26"/>
    <text class="name" x="120" y="367">No clear</text>
    <path class="grey" d="M130,355 h1.5 a1.5,1.5 0 0 1 1.5,1.5 v13 a1.5,1.5 0 0 1 -1.5,1.5 h-1.5 z"/>
    <text class="val" x="139" y="367">44 ns</text>
  </g>
  <g>
    <title>65,536 class rows, Inline clear: median 6,738 ns on the releasing thread (runs: 6,738, 6,800, 6,738).</title>
    <rect class="hit" x="0" y="376" width="520" height="26"/>
    <text class="name" x="120" y="393">Inline clear</text>
    <path class="one" d="M130,381 h314 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-314 z"/>
    <text class="val" x="454" y="393">6,738 ns</text>
  </g>
  <g>
    <title>65,536 class rows, Hand to the bin: median 144 ns on the releasing thread (runs: 144, 138, 162).</title>
    <rect class="hit" x="0" y="402" width="520" height="26"/>
    <text class="name" x="120" y="419">Hand to the bin</text>
    <path class="select" d="M130,407 h3.4 a3.4,3.4 0 0 1 3.4,3.4 v9.2 a3.4,3.4 0 0 1 -3.4,3.4 h-3.4 z"/>
    <text class="val" x="142.8" y="419">144 ns</text>
  </g>
  <line class="axis" x1="130" y1="350" x2="130" y2="428"/>
  <text class="muted small" x="16" y="450">Bin proof, 2026-11-21, median of 3 runs. Numbers: pool-release-path.csv</text>
</svg>
