<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366" role="img" aria-labelledby="link-memory-title link-memory-desc">
  <title id="link-memory-title">Memory with the sync read and with AsyncReads()</title>
  <desc id="link-memory-desc">Two panels on one scale, memory allocated per operation over a simulated slow link, for the sync read and for AsyncReads(). Every bar starts at zero. Map(Func): Sync read (the default) 9,713 KB; AsyncReads() (opt-in) 16,812 KB. Map&lt;T&gt;(): Sync read (the default) 9,709 KB; AsyncReads() (opt-in) 9,743 KB.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="519" height="365" rx="8"/>
  <text class="title" x="16" y="28">Memory with the sync read and with AsyncReads()</text>
  <text class="muted" x="16" y="48">Smaller is better. SQL Server, 5 ms, 100 Mbit link, 10,000 rows, 20 columns.</text>
  <rect class="one" x="16" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="72">ODX, sync read (the default)</text>
  <rect class="select" x="233" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="251" y="72">ODX with AsyncReads() (opt-in)</text>
  <text class="head" x="16" y="108">Map(Func)</text>
  <line class="grid" x1="170" y1="118" x2="170" y2="170"/>
  <text class="muted small mid" x="170" y="186">0</text>
  <line class="grid" x1="239.5" y1="118" x2="239.5" y2="170"/>
  <text class="muted small mid" x="239.5" y="186">5,000</text>
  <line class="grid" x1="309" y1="118" x2="309" y2="170"/>
  <text class="muted small mid" x="309" y="186">10,000</text>
  <line class="grid" x1="378.5" y1="118" x2="378.5" y2="170"/>
  <text class="muted small mid" x="378.5" y="186">15,000</text>
  <line class="grid" x1="448" y1="118" x2="448" y2="170"/>
  <text class="muted small mid" x="448" y="186">20,000</text>
  <g>
    <title>Map(Func), Sync read (the default): 9,713 KB allocated per operation, 538.3 ms, 0 of 10,001 ReadAsync calls incomplete.</title>
    <rect class="hit" x="0" y="118" width="520" height="26"/>
    <text class="name" x="160" y="135">Sync read (the default)</text>
    <path class="one" d="M170,123 h131.01 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-131.01 z"/>
    <text class="val" x="311.01" y="135">9,713 KB</text>
  </g>
  <g>
    <title>Map(Func), AsyncReads() (opt-in): 16,812 KB allocated per operation, 538.2 ms, 788.7 of 10,001 ReadAsync calls incomplete.</title>
    <rect class="hit" x="0" y="144" width="520" height="26"/>
    <text class="name" x="160" y="161">AsyncReads() (opt-in)</text>
    <path class="select" d="M170,149 h229.69 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-229.69 z"/>
    <text class="val" x="409.69" y="161">16,812 KB</text>
  </g>
  <line class="axis" x1="170" y1="118" x2="170" y2="170"/>
  <text class="head" x="16" y="222">Map&lt;T&gt;()</text>
  <line class="grid" x1="170" y1="232" x2="170" y2="284"/>
  <text class="muted small mid" x="170" y="300">0</text>
  <line class="grid" x1="239.5" y1="232" x2="239.5" y2="284"/>
  <text class="muted small mid" x="239.5" y="300">5,000</text>
  <line class="grid" x1="309" y1="232" x2="309" y2="284"/>
  <text class="muted small mid" x="309" y="300">10,000</text>
  <line class="grid" x1="378.5" y1="232" x2="378.5" y2="284"/>
  <text class="muted small mid" x="378.5" y="300">15,000</text>
  <line class="grid" x1="448" y1="232" x2="448" y2="284"/>
  <text class="muted small mid" x="448" y="300">20,000</text>
  <g>
    <title>Map&lt;T&gt;(), Sync read (the default): 9,709 KB allocated per operation, 538.3 ms, 0 of 10,001 ReadAsync calls incomplete.</title>
    <rect class="hit" x="0" y="232" width="520" height="26"/>
    <text class="name" x="160" y="249">Sync read (the default)</text>
    <path class="one" d="M170,237 h130.96 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-130.96 z"/>
    <text class="val" x="310.96" y="249">9,709 KB</text>
  </g>
  <g>
    <title>Map&lt;T&gt;(), AsyncReads() (opt-in): 9,743 KB allocated per operation, 538.2 ms, 4 of 10,001 ReadAsync calls incomplete.</title>
    <rect class="hit" x="0" y="258" width="520" height="26"/>
    <text class="name" x="160" y="275">AsyncReads() (opt-in)</text>
    <path class="select" d="M170,263 h131.43 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-131.43 z"/>
    <text class="val" x="311.43" y="275">9,743 KB</text>
  </g>
  <line class="axis" x1="170" y1="232" x2="170" y2="284"/>
  <text class="muted small mid" x="309" y="316">kilobytes allocated per operation</text>
  <text class="muted small" x="16" y="344">Run 2026-11-15, mean of 3 operations. Numbers: link-memory.csv</text>
</svg>
