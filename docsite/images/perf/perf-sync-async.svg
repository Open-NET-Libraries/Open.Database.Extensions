<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 552" role="img" aria-labelledby="sync-async-title sync-async-desc">
  <title id="sync-async-title">Sync reads against async reads</title>
  <desc id="sync-async-desc">Four panels of three bars each, one panel per condition, each on its own scale: sync, async execute, and async read. Every bar starts at zero. Neither: Sync 77.3 µs; Async execute 80.9 µs; Async read 82.3 µs. Busy thread pool: Sync 94.4 µs; Async execute 97.4 µs; Async read 102.4 µs. Buffer refills: Sync 257.9 µs; Async execute 261.2 µs; Async read 314.3 µs. Refills and busy pool: Sync 279.3 µs; Async execute 279.0 µs; Async read 11.2 ms.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-fill: #ddf4ff;
      --one-line: #0969da;
      --select-fill: #dafbe1;
      --select-line: #1a7f37;
      --dapper-fill: #ffe8d1;
      --dapper-line: #bc4c00;
      --grey-fill: #eaeef2;
      --grey-line: #6e7781;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-fill: #0c2d6b;
        --one-line: #58a6ff;
        --select-fill: #0f3d1f;
        --select-line: #3fb950;
        --dapper-fill: #4a2a0e;
        --dapper-line: #f0883e;
        --grey-fill: #2d333b;
        --grey-line: #8b949e;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-fill); stroke: var(--one-line); stroke-width: 1.5; }
    .select { fill: var(--select-fill); stroke: var(--select-line); stroke-width: 1.5; }
    .dapper { fill: var(--dapper-fill); stroke: var(--dapper-line); stroke-width: 1.5; }
    .grey { fill: var(--grey-fill); stroke: var(--grey-line); stroke-width: 1.5; }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="559" height="551" rx="8"/>
  <text class="title" x="16" y="28">Sync reads against async reads</text>
  <text class="muted" x="16" y="48">Reader-open time, RowMap plan, 20 columns, 1,000 rows. Each panel has its own scale.</text>
  <text class="head" x="16" y="80">Neither</text>
  <g>
    <title>Neither, Sync: reader open 77.3 µs, 1.00× the sync read; 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="90" width="560" height="26"/>
    <text class="name" x="100" y="107">Sync</text>
    <rect class="one" x="110.75" y="95" width="353.31" height="16" rx="4"/>
    <text class="val" x="470.81" y="107">77.3 µs</text>
  </g>
  <g>
    <title>Neither, Async execute: reader open 80.9 µs, 1.05× the sync read; 227.5 KB allocated.</title>
