    <rect class="one" x="110.75" y="211" width="347.05" height="16" rx="4"/>
    <text class="val" x="464.55" y="223">94.4 µs</text>
  </g>
  <g>
    <title>Busy thread pool, Async execute: reader open 97.4 µs, 1.03× the sync read; 227.5 KB allocated.</title>
    <rect class="hit" x="0" y="232" width="560" height="26"/>
