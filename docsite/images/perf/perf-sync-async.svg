    <rect class="hit" x="0" y="258" width="560" height="26"/>
    <text class="name" x="100" y="275">Async read</text>
    <rect class="one" x="110.75" y="263" width="376.5" height="16" rx="4"/>
    <text class="val" x="494" y="275">102.4 µs</text>
  </g>
  <line class="axis" x1="110" y1="206" x2="110" y2="284"/>
  <text class="head" x="16" y="312">Buffer refills</text>
  <g>
    <title>Buffer refills, Sync: reader open 257.9 µs, 1.00× the sync read; 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="322" width="560" height="26"/>
    <text class="name" x="100" y="339">Sync</text>
    <rect class="one" x="110.75" y="327" width="308.61" height="16" rx="4"/>
    <text class="val" x="426.11" y="339">257.9 µs</text>
  </g>
  <g>
    <title>Buffer refills, Async execute: reader open 261.2 µs, 1.01× the sync read; 227.5 KB allocated.</title>
    <rect class="hit" x="0" y="348" width="560" height="26"/>
    <text class="name" x="100" y="365">Async execute</text>
    <rect class="one" x="110.75" y="353" width="312.67" height="16" rx="4"/>
    <text class="val" x="430.17" y="365">261.2 µs</text>
  </g>
  <g>
    <title>Buffer refills, Async read: reader open 314.3 µs, 1.22× the sync read; 229.9 KB allocated.</title>
    <rect class="hit" x="0" y="374" width="560" height="26"/>
    <text class="name" x="100" y="391">Async read</text>
    <rect class="one" x="110.75" y="379" width="376.5" height="16" rx="4"/>
    <text class="val" x="494" y="391">314.3 µs</text>
  </g>
  <line class="axis" x1="110" y1="322" x2="110" y2="400"/>
  <text class="head" x="16" y="428">Refills and busy pool</text>
  <g>
    <title>Refills and busy pool, Sync: reader open 279.3 µs, 1.00× the sync read; 227.4 KB allocated.</title>
    <rect class="hit" x="0" y="438" width="560" height="26"/>
    <text class="name" x="100" y="455">Sync</text>
    <rect class="one" x="110.75" y="443" width="7.95" height="16" rx="4"/>
    <text class="val" x="125.45" y="455">279.3 µs</text>
  </g>
  <g>
    <title>Refills and busy pool, Async execute: reader open 279.0 µs, 1.00× the sync read; 227.5 KB allocated.</title>
    <rect class="hit" x="0" y="464" width="560" height="26"/>
    <text class="name" x="100" y="481">Async execute</text>
    <rect class="one" x="110.75" y="469" width="7.94" height="16" rx="4"/>
    <text class="val" x="125.44" y="481">279.0 µs</text>
  </g>
  <g>
    <title>Refills and busy pool, Async read: reader open 11.2 ms, 40.01× the sync read; 231.3 KB allocated.</title>
    <rect class="hit" x="0" y="490" width="560" height="26"/>
    <text class="name" x="100" y="507">Async read</text>
    <rect class="one" x="110.75" y="495" width="376.5" height="16" rx="4"/>
    <text class="val" x="494" y="507">11.2 ms</text>
