<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 304" role="img" aria-labelledby="link-time-title link-time-desc">
  <title id="link-time-title">Time over a slow link</title>
  <desc id="link-time-desc">Two panels of two bars each, each panel on its own scale: the time of one operation over a simulated 5 ms, 100 Mbit link, for the ODX sync read and for raw SqlClient with ReadAsync. Every bar starts at zero. S2, 10,000 rows, 20 columns: ODX Map&lt;T&gt;(), sync read 537.5 ms; Raw SqlClient, no ODX 540.7 ms. S3, 10,000 rows, 8,000-byte Body column: ODX Map&lt;T&gt;(), sync read 6,759.7 ms; Raw SqlClient, no ODX 6,757.4 ms.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #4b5563;
      --bg: #ffffff;
      --frame: #d0d7de;
      --grid: #e6eaef;
      --axis: #8c959f;
      --one-line: #2a78d6;
      --select-line: #1baf7a;
      --dapper-line: #eb6834;
      --grey-line: #8b929c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --muted: #b1bac4;
        --bg: #0d1117;
        --frame: #30363d;
        --grid: #21262d;
        --axis: #8b949e;
        --one-line: #3987e5;
        --select-line: #199e70;
        --dapper-line: #d95926;
        --grey-line: #7a828c;
      }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11.5px; }
    .val { font-size: 12.5px; }
    .big { font-size: 30px; font-weight: 600; }
    .name { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .hit { fill: transparent; }
    .tile { fill: none; stroke: var(--frame); stroke-width: 1; }
    .one { fill: var(--one-line); }
    .select { fill: var(--select-line); }
    .dapper { fill: var(--dapper-line); }
    .grey { fill: var(--grey-line); }
    .l-one { fill: none; stroke: var(--one-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-select { fill: none; stroke: var(--select-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-dapper { fill: none; stroke: var(--dapper-line); stroke-width: 2.5; stroke-linejoin: round; }
    .l-grey { fill: none; stroke: var(--grey-line); stroke-width: 2.5; stroke-linejoin: round; }
    .dash { stroke-dasharray: 7 4; }
    .m-one { fill: var(--one-line); stroke: var(--bg); stroke-width: 2; }
    .m-select { fill: var(--select-line); stroke: var(--bg); stroke-width: 2; }
    .m-dapper { fill: var(--dapper-line); stroke: var(--bg); stroke-width: 2; }
    .m-grey { fill: var(--grey-line); stroke: var(--bg); stroke-width: 2; }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="519" height="303" rx="8"/>
  <text class="title" x="16" y="28">Time over a slow link</text>
  <text class="muted" x="16" y="48">Shorter is better. 5 ms delay, 100 Mbit, SQL Server, 10,000 rows.</text>
  <rect class="one" x="16" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="34" y="72">ODX, sync read (the default)</text>
  <rect class="grey" x="233" y="62" width="12" height="12" rx="3"/>
  <text class="small" x="251" y="72">Raw SqlClient, no ODX</text>
  <text class="head" x="16" y="108">S2, 10,000 rows, 20 columns</text>
  <g>
    <title>ODX Map&lt;T&gt;().ToList(), sync read: 537.5 ms per operation, 10,000 rows, 20 columns.</title>
    <rect class="hit" x="0" y="118" width="520" height="26"/>
    <text class="name" x="160" y="135">ODX Map&lt;T&gt;(), sync read</text>
    <path class="one" d="M170,123 h272.35 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-272.35 z"/>
    <text class="val" x="452.35" y="135">537.5 ms</text>
  </g>
  <g>
    <title>Raw SqlClient, Default, ReadAsync, sync getters: 540.7 ms per operation, 10,000 rows, 20 columns.</title>
    <rect class="hit" x="0" y="144" width="520" height="26"/>
    <text class="name" x="160" y="161">Raw SqlClient, no ODX</text>
    <path class="grey" d="M170,149 h274 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-274 z"/>
    <text class="val" x="454" y="161">540.7 ms</text>
  </g>
  <line class="axis" x1="170" y1="118" x2="170" y2="170"/>
  <text class="head" x="16" y="198">S3, 10,000 rows, 8,000-byte Body column</text>
  <g>
    <title>ODX Map&lt;T&gt;().ToList(), sync read: 6,759.7 ms per operation, 10,000 rows, 8,000-byte Body column.</title>
    <rect class="hit" x="0" y="208" width="520" height="26"/>
    <text class="name" x="160" y="225">ODX Map&lt;T&gt;(), sync read</text>
    <path class="one" d="M170,213 h274 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-274 z"/>
    <text class="val" x="454" y="225">6,759.7 ms</text>
  </g>
  <g>
    <title>Raw SqlClient, Default, ReadAsync, sync getters: 6,757.4 ms per operation, 10,000 rows, 8,000-byte Body column.</title>
    <rect class="hit" x="0" y="234" width="520" height="26"/>
    <text class="name" x="160" y="251">Raw SqlClient, no ODX</text>
    <path class="grey" d="M170,239 h273.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-273.9 z"/>
    <text class="val" x="453.9" y="251">6,757.4 ms</text>
  </g>
  <line class="axis" x1="170" y1="208" x2="170" y2="260"/>
  <text class="muted small" x="16" y="282">Run 2026-11-14, one run per case. Numbers: link-time.csv</text>
</svg>
