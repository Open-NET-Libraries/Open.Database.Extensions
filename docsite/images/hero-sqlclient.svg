<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" role="img" aria-labelledby="t d">
  <title id="t">ODX SqlClient</title>
  <desc id="d">You write the SQL. The library writes the other twenty lines. Deprecated: a faded database points toward the brighter MSSqlClient database, which replaces it.</desc>
  <style>
    :root {
      --bg1: #eef2f7; --bg2: #e1e7f0; --edge: #cdd6e2; --ink: #263040; --ink2: #3c4759; --mute: #6a778a;
      --glass: #f7f9fc; --glassT: #fbfcfe; --glassS: #dfe5ee; --gline: #b9c4d3; --sh: #3e4d66; --sho: .22; --well: #d6dde8;
      --a: #6b7a90; --a2: #b9c3d1; --a3: #566377; --at: #4e5b6e;
      --tf: #d4dae2; --tt: #e0e5eb; --ts: #c2cad4; --te: #abb4c2;
      --b: #b07a22; --b2: #e6c487; --b3: #8f5f14; --bt: #875810;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #1b2434; --bg2: #222c40; --edge: #34425a; --ink: #d6dee9; --ink2: #b4bfcf; --mute: #8592a6;
        --glass: #2b3850; --glassT: #34435e; --glassS: #222d42; --gline: #4b5b77; --sh: #05080f; --sho: .5; --well: #1d2638;
      --a: #9aa7ba; --a2: #c5cedb; --a3: #78859a; --at: #aab6c7;
      --tf: #465165; --tt: #384256; --ts: #5c677b; --te: #788598;
      --b: #d9ad62; --b2: #f0d39c; --b3: #b08440; --bt: #e2b977;
      }
    }
    .s1 { stop-color: var(--bg1); } .s2 { stop-color: var(--bg2); } .ga { stop-color: var(--a); } .gb { stop-color: var(--a3); }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .tag1 { font-size: 40px; font-weight: 600; letter-spacing: -.2px; }
    .tag2 { font-size: 31px; font-weight: 400; fill: var(--ink2); letter-spacing: -.2px; }
    .acc { fill: var(--at); }
    .pk { font-size: 26px; font-weight: 600; fill: var(--at); letter-spacing: .3px; }
    .lbl { font-size: 21px; font-weight: 600; fill: var(--ink); }
    .word { font-size: 18px; fill: var(--ink2); }
    .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, Menlo, monospace; font-size: 19px; fill: var(--ink2); }
    .letters { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .rule { stroke: var(--edge); stroke-width: 2; }
    .af { fill: var(--a); } .at { fill: var(--a2); } .as { fill: var(--a3); }
    .gf { fill: var(--glass); fill-opacity: .6; stroke: var(--gline); stroke-width: 2; }
    .gt { fill: var(--glassT); fill-opacity: .75; stroke: var(--gline); stroke-width: 2; }
    .gs { fill: var(--glassS); fill-opacity: .7; stroke: var(--gline); stroke-width: 2; }
    .tf { fill: var(--tf); stroke: var(--te); stroke-width: 2; } .tt { fill: var(--tt); stroke: var(--te); stroke-width: 2; } .ts { fill: var(--ts); stroke: var(--te); stroke-width: 2; }
    .nf, .ns { fill: var(--glassS); stroke: var(--gline); stroke-width: 2; } .nt { fill: var(--glassT); stroke: var(--gline); stroke-width: 2; }
    .sh { fill: var(--sh); fill-opacity: var(--sho); }
    .row rect { fill: var(--a); } .row path { stroke: var(--a2); stroke-width: 2; fill: none; }
    .row.hi rect { fill: var(--at); }
    .wire { fill: none; stroke: var(--gline); stroke-width: 2.6; stroke-linecap: round; }
    .wire.on { stroke: var(--a); stroke-width: 3.2; }
    .ghost { opacity: .55; }
    .ms { fill: url(#disk); } .mt { fill: var(--a2); stroke: var(--a); stroke-width: 2; }
    .m2s { fill: url(#amber); } .m2t { fill: var(--b2); stroke: var(--b); stroke-width: 2; }
    .word { font-size: 20px; } .ms2 { fill: var(--bt); font-weight: 600; }
    .am1 { stop-color: var(--b); } .am2 { stop-color: var(--b3); }
    @media (prefers-reduced-motion: reduce) { .mv { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="ga"/><stop offset="1" class="gb"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" class="ga" stop-opacity=".14"/><stop offset="1" class="ga" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="am1"/><stop offset="1" class="am2"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="198" rx="16" fill="url(#bg)" stroke="var(--edge)" stroke-width="2"/>
  <ellipse cx="1070" cy="100" rx="250" ry="110" fill="url(#glow)"/>

  <g transform="translate(0 -6)">
    <path class="ms" d="M48 101v9a22 6.5 0 0 0 44 0v-9z"/><ellipse class="mt" cx="70" cy="101" rx="22" ry="6.5"/><path class="ms" d="M48 88v9a22 6.5 0 0 0 44 0v-9z"/><ellipse class="mt" cx="70" cy="88" rx="22" ry="6.5"/><path class="ms" d="M48 75v9a22 6.5 0 0 0 44 0v-9z"/><ellipse class="mt" cx="70" cy="75" rx="22" ry="6.5"/><path class="letters" d="M120 74.5a13.5 16.5 0 1 0 0.01 0ZM147.5 74.5V107.5H154.5A15 16.5 0 0 0 154.5 74.5ZM182.5 74.5L206.5 107.5M206.5 74.5L182.5 107.5"/>
    <text class="pk" x="125" y="143" text-anchor="middle">SqlClient</text>
    <path class="rule" d="M248 52V150"/>
  </g>
  <text class="tag1" x="274" y="88">You write the <tspan class="acc">SQL.</tspan></text>
  <text class="tag2" x="275" y="142">The library writes the other twenty lines.</text>
  <rect class="sh" x="900" y="132" width="80" height="10" rx="5" filter="url(#blur)"/><rect class="sh" x="1112" y="146" width="116" height="12" rx="6" filter="url(#blur)"/><g class="ghost"><path class="ts" d="M900 106v16a40 10 0 0 0 80 0v-16z"/><ellipse class="tt" cx="940" cy="106" rx="40" ry="10"/><path class="ts" d="M900 85v16a40 10 0 0 0 80 0v-16z"/><ellipse class="tt" cx="940" cy="85" rx="40" ry="10"/><path class="ts" d="M900 64v16a40 10 0 0 0 80 0v-16z"/><ellipse class="tt" cx="940" cy="64" rx="40" ry="10"/></g><path class="m2s" d="M1116 108v22a54 13 0 0 0 108 0v-22z"/><ellipse class="m2t" cx="1170" cy="108" rx="54" ry="13"/><path class="m2s" d="M1116 81v22a54 13 0 0 0 108 0v-22z"/><ellipse class="m2t" cx="1170" cy="81" rx="54" ry="13"/><path class="m2s" d="M1116 54v22a54 13 0 0 0 108 0v-22z"/><ellipse class="m2t" cx="1170" cy="54" rx="54" ry="13"/><path class="wire" d="M998 98H1094" stroke-dasharray="2 8"/><path class="wire" d="M1086 91l9 7-9 7"/><text class="word" x="940" y="178" text-anchor="middle">deprecated</text><text class="word ms2" x="1170" y="178" text-anchor="middle">MSSqlClient</text>
</svg>