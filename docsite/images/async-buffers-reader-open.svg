<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="open-title open-desc">
  <title id="open-title">Reader-open time against consumer speed</title>
  <desc id="open-desc">Three panels, each a pair of bars that start at zero, in milliseconds the reader is held open, for 10,000 rows on a synthetic provider with a 50 microsecond refill every 100 rows, one run. Left bar of each pair: the chunk stream, ToPooledBufferStream. Right bar: reading the rows with no buffer, the consumer working inside the read. Consumer at 40 nanoseconds per row: 6.19 against 6.39 milliseconds. Consumer at 1 microsecond per row: 6.26 against 16.01 milliseconds. Consumer waiting 20 microseconds per 100 rows: 6.17 against 8.01 milliseconds. The chunk stream holds the reader the same time however slow the consumer is; with no buffer the reader is held as long as the consumer takes.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --bg: #ffffff;
      --frame: #d0d7de;
      --muted: #4b5563;
      --def-line: #0969da;
      --opt-line: #8250df;
      --cap-line: #8c959f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --bg: #0d1117;
        --frame: #30363d;
        --muted: #b1bac4;
        --def-line: #58a6ff;
        --opt-line: #bc8cff;
        --cap-line: #8b949e;
      }
    }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .title { font-size: 18px; font-weight: 600; }
    .head { font-weight: 600; }
    .muted { fill: var(--muted); }
    .mid { text-anchor: middle; }
    .panel { fill: none; stroke: var(--cap-line); stroke-width: 1; }
    .base { stroke: var(--cap-line); stroke-width: 1.5; }
    .def { fill: var(--def-line); }
    .opt { fill: var(--opt-line); }
  </style>

  <rect class="frame" x="0.5" y="0.5" width="599" height="439" rx="8"/>

  <text class="title" x="16" y="28">How long the reader is held open</text>

  <!-- Every panel: scale 160 = 16.01 ms (9.996 px per ms). -->

  <!-- Panel 1: 40 ns per row. -->
  <rect class="panel" x="16" y="42" width="180" height="290" rx="8"/>
  <text class="head mid" x="106" y="64">40 ns per row</text>
  <text class="mid muted" x="106" y="81">reader open, ms</text>
  <rect class="def" x="41" y="208.1" width="55" height="61.9" rx="4"/>
  <rect class="opt" x="116" y="206.2" width="55" height="63.8" rx="4"/>
  <text class="mid" x="68.5" y="202.1">6.19</text>
  <text class="mid" x="143.5" y="200.2">6.39</text>
  <line class="base" x1="26" y1="270" x2="186" y2="270"/>
  <text class="mid" x="68.5" y="288">chunk</text>
  <text class="mid" x="68.5" y="304">stream</text>
  <text class="mid" x="143.5" y="288">no</text>
  <text class="mid" x="143.5" y="304">buffer</text>

  <!-- Panel 2: 1 us per row. -->
  <rect class="panel" x="210" y="42" width="180" height="290" rx="8"/>
  <text class="head mid" x="300" y="64">1 &#181;s per row</text>
  <text class="mid muted" x="300" y="81">reader open, ms</text>
  <rect class="def" x="235" y="207.4" width="55" height="62.6" rx="4"/>
  <rect class="opt" x="310" y="110" width="55" height="160" rx="4"/>
  <text class="mid" x="262.5" y="201.4">6.26</text>
  <text class="mid" x="337.5" y="104">16.01</text>
  <line class="base" x1="220" y1="270" x2="380" y2="270"/>
  <text class="mid" x="262.5" y="288">chunk</text>
  <text class="mid" x="262.5" y="304">stream</text>
  <text class="mid" x="337.5" y="288">no</text>
  <text class="mid" x="337.5" y="304">buffer</text>

  <!-- Panel 3: a 20 us wait per 100 rows. -->
  <rect class="panel" x="404" y="42" width="180" height="290" rx="8"/>
  <text class="head mid" x="494" y="64">20 &#181;s wait per 100 rows</text>
  <text class="mid muted" x="494" y="81">reader open, ms</text>
  <rect class="def" x="429" y="208.4" width="55" height="61.6" rx="4"/>
  <rect class="opt" x="504" y="189.9" width="55" height="80.1" rx="4"/>
  <text class="mid" x="456.5" y="202.4">6.17</text>
  <text class="mid" x="531.5" y="183.9">8.01</text>
  <line class="base" x1="414" y1="270" x2="574" y2="270"/>
  <text class="mid" x="456.5" y="288">chunk</text>
  <text class="mid" x="456.5" y="304">stream</text>
  <text class="mid" x="531.5" y="288">no</text>
  <text class="mid" x="531.5" y="304">buffer</text>

  <text x="16" y="358">Left bar: ToPooledBufferStream. Right bar: no buffer, the consumer works inside the</text>
  <text x="16" y="376">read. Every bar starts at zero, on one scale. The slower the consumer, the</text>
  <text x="16" y="394">longer the unbuffered read holds the reader; the chunk stream does not change.</text>
  <text class="muted" x="16" y="418">Source: pooled-buffer-cost.csv (run pbcost-A, 2026-11-23), synthetic provider, net11,</text>
  <text class="muted" x="16" y="434">10,000 rows, a 50 &#181;s refill every 100 rows, one run. Not a real database.</text>
</svg>
